# Netlify configuration — B&C Wedding Source of Truth
# Deploy from repo root:  netlify deploy --dir=wedding --prod

[build]
  publish = "wedding"

# Root URL serves the landing page
[[redirects]]
  from = "/"
  to = "/00_START_HERE_index.html"
  status = 200

# Short links — Command Center App
[[redirects]]
  from = "/app"
  to = "/01_Command_Center/CB_Command_Center_App.html"
  status = 200

[[redirects]]
  from = "/app/*"
  to = "/01_Command_Center/CB_Command_Center_App.html"
  status = 200

[[redirects]]
  from = "/os"
  to = "/01_Command_Center/CB_WeddingOS_v6.html"
  status = 200

[[redirects]]
