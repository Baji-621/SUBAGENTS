<!DOCTYPE html>
<html lang="en" data-theme="ivory">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>B &amp; C Wedding Command Center</title>
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Password-protected wedding command center — dashboard, events, tasks, vendors, budget, contacts.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Lora:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html[data-theme="ivory"],html:not([data-theme]){color-scheme:light}
html.dark{color-scheme:dark}
html,body{min-height:100%;background:var(--ground);color:var(--text);font-family:var(--font-body,'Lora',Georgia,serif)}
.font-serif{font-family:var(--font-display,'Cormorant Garamond',Georgia,serif)}
#gate{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:9999;padding:24px;background:var(--ground)}
.gate-box{text-align:center;max-width:360px;width:100%}
.gate-mono{font-size:72px;font-style:italic;line-height:1;color:var(--accent)}
.gate-title{font-size:22px;margin:12px 0 24px;color:var(--display)}
.gate-input{width:100%;padding:12px 16px;border-radius:8px;margin-bottom:12px;border:1px solid var(--border);background:var(--surface);color:var(--text-strong)}
.gate-btn{width:100%;padding:12px;border:none;border-radius:8px;font-weight:600;cursor:pointer;background:var(--accent);color:var(--btn-primary-fg,#faf6ee)}
.sb-link.on{background:var(--surface2);color:var(--accent);font-weight:600}
.banner{background:var(--surface2);border:1px solid var(--border);color:var(--accent)}
.main{background:var(--ground)}
.gate-err{color:var(--bad);font-size:13px;margin-top:8px;min-height:20px}
#app{display:none;height:100vh;overflow:hidden}
#app.ready{display:flex}
.sidebar{width:var(--sidebar);min-width:var(--sidebar);display:flex;flex-direction:column;height:100%;overflow-y:auto}
.sb-head{padding:24px 20px 16px;border-bottom:1px solid var(--border)}
.sb-mono{font-size:36px;font-style:italic;color:var(--accent)}
.sb-sub{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.sb-date{font-size:12px;color:var(--muted);margin-top:8px}
.sb-nav{flex:1;padding:12px 10px}
.sb-group{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding:12px 10px 6px;font-weight:600}
.sb-link{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;color:var(--muted);text-decoration:none;font-size:14px;margin-bottom:2px;background:none;border:none;width:100%;text-align:left;cursor:pointer}
.sb-link:hover{background:var(--surface2);color:var(--text-strong)}
.sb-foot{padding:16px;border-top:1px solid var(--border);font-size:11px;color:var(--muted)}
.main{flex:1;overflow-y:auto;padding:28px 32px 48px}
.page-head{margin-bottom:24px}
.page-head h1{font-size:28px;font-weight:600;color:var(--display)}
.page-head p{font-size:13px;color:var(--muted);margin-top:4px}
.banner{border-radius:10px;padding:12px 18px;margin-bottom:20px;font-size:13px}
.grid-4{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:24px}
.card{border-radius:12px;padding:18px}
.card-label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:8px}
.card-val{font-size:32px;color:var(--accent)}
.progress{height:6px;background:var(--surface2);border-radius:3px;margin-top:10px;overflow:hidden}
.progress>span{display:block;height:100%;background:var(--accent);border-radius:3px}
.section-title{font-size:18px;color:var(--display);margin:24px 0 12px}
.event-row{display:flex;gap:16px;padding:14px 0;border-bottom:1px solid var(--border)}
.event-row:last-child{border-bottom:none}
.date-badge{min-width:52px;text-align:center}
.date-badge .d{font-size:28px;color:var(--accent);line-height:1}
.date-badge .m{font-size:10px;text-transform:uppercase;color:var(--muted);letter-spacing:.08em}
.event-row.key{border:1px solid var(--accent);border-radius:10px;padding:14px 16px;margin-bottom:8px;background:var(--surface2)}
.badge{display:inline-block;font-size:10px;padding:3px 8px;border-radius:4px;text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.task-list{display:flex;flex-direction:column;gap:8px}
.task-item{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:10px;font-size:13px}
.task-item.done{opacity:.85}
.task-body{flex:1;min-width:0}
.task-check{margin-top:4px;cursor:pointer;accent-color:var(--accent)}
.task-status-select{font-size:11px;padding:4px 8px;border:1px solid var(--border);border-radius:6px;background:var(--surface);color:var(--text)}
.task-del-btn{border:1px solid var(--border);background:var(--surface2);color:var(--bad);border-radius:6px;padding:2px 8px;font-size:16px;line-height:1;cursor:pointer}
.task-item.overdue{border-color:var(--bad)}
.kanban{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;min-height:300px}
.k-col{border-radius:12px;padding:12px}
.k-col h3{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin-bottom:10px}
.vendor-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.v-card{border-radius:12px;padding:16px}
.v-card h3{font-size:18px;color:var(--display);margin-bottom:4px}
.v-role{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px}
.v-row{font-size:12px;margin:4px 0;color:var(--muted)}
.v-row strong{color:var(--text-strong)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--border)}
th{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.contact-list{display:flex;flex-direction:column;gap:8px}
.contact-row{display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:14px 16px;border-radius:10px}
.contact-row .name{font-weight:600;color:var(--display);min-width:160px}
.quick-dial{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:20px}
.quick-btn{padding:14px 20px;border:1px solid var(--border);border-radius:10px;color:var(--accent);font-weight:600;font-size:14px;text-decoration:none}
.alert-list{display:flex;flex-direction:column;gap:8px;margin-bottom:20px}
.alert{padding:10px 14px;border-radius:8px;font-size:13px;border-left:3px solid}
.alert.critical{background:color-mix(in srgb,var(--bad) 12%,transparent);border-color:var(--bad)}
.alert.urgent{background:color-mix(in srgb,var(--warn) 12%,transparent);border-color:var(--warn)}
.alert.info{background:color-mix(in srgb,var(--ok) 12%,transparent);border-color:var(--ok)}
.mobile-toggle{display:none;position:fixed;top:12px;left:12px;z-index:100;padding:10px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--text)}
.visually-hidden{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);border:0}
.hub-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.hub-card{display:block;padding:18px;border-radius:12px;border:1px solid var(--border);text-decoration:none;color:inherit;background:var(--surface);transition:border-color .15s}
.hub-card:hover{border-color:var(--accent)}
.gap-list{list-style:none;padding:0}
.gap-list li{padding:10px 0;border-bottom:1px solid var(--border);font-size:13px;color:var(--text)}
.comms-card{margin-bottom:12px}
.ch-tag{display:inline-block;font-size:10px;padding:3px 8px;border-radius:4px;background:var(--surface2);text-transform:uppercase;letter-spacing:.05em}
.copy-btn{font-size:11px;padding:6px 10px;border-radius:6px;border:1px solid var(--border);background:var(--surface2);cursor:pointer;margin-right:6px;margin-top:8px;color:var(--text)}
.av-quote{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-bottom:24px}
.v-toolbar-extra{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:16px}
.v-search{flex:1;min-width:200px;padding:10px 14px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:14px}
.v-ext-link{font-size:13px;color:var(--accent);text-decoration:none;white-space:nowrap}
.v-section{margin-bottom:28px}
.v-section-title{font-size:16px;color:var(--display);margin-bottom:10px;display:flex;align-items:baseline;gap:8px}
.v-count{font-size:12px;color:var(--muted);font-weight:400}
.v-roster{display:flex;flex-direction:column;gap:2px}
.v-row{display:flex;flex-wrap:wrap;align-items:flex-start;gap:12px;padding:14px 16px;border-radius:10px;border:1px solid var(--border);background:var(--surface);margin-bottom:6px}
.v-row-main{flex:1;min-width:220px}
.v-row-head{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:4px}
.v-name{font-weight:600;color:var(--display);font-size:15px}
.v-meta{font-size:12px;color:var(--muted)}
.v-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.v-chip{font-size:10px;padding:2px 8px;border-radius:4px;background:var(--surface2);color:var(--muted)}
.v-notes{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.45;max-width:56ch}
.v-quote{font-size:13px;color:var(--accent);margin-left:auto}
.v-actions{display:flex;gap:8px;align-items:center}
.v-act{font-size:12px;padding:6px 10px;border-radius:6px;border:1px solid var(--border);color:var(--accent);text-decoration:none;background:var(--surface2)}
.k-col.drag-over{outline:2px dashed var(--accent);outline-offset:2px}
.task-item.dragging{opacity:.55;cursor:grabbing}
.live-pill{font-size:11px;color:var(--muted);margin-top:8px}
.live-pill strong{color:var(--accent);font-weight:600}
@media(max-width:768px){
  .sidebar{position:fixed;left:0;top:0;z-index:90;transform:translateX(-100%);transition:transform .2s}
  .sidebar.open{transform:translateX(0)}
  .mobile-toggle{display:block}
  .main{padding:60px 16px 40px}
  .kanban{grid-template-columns:1fr}
}
/* Fonts loaded via <link> in build-command-center-app.mjs */

/* ── Ivory (default light) ── */
:root,
html[data-theme="ivory"] {
  --ground: #faf6ee;
  --surface: #ffffff;
  --surface2: #f5efe6;
  --border: #e8dcc8;
  --text: #7b5a6a;
  --text-strong: #5c3d4a;
  --muted: #9a8490;
  --accent: #c9a84c;
  --accent-hover: #b8943a;
  --link: #2a7b8e;
  --link-hover: #1f6272;
  --display: #5c3d4a;
  --ok: #4a8a5a;
  --warn: #b8860b;
  --bad: #a84848;
  --sidebar: 260px;
  --chip-ceremony: #e8dcc8;
  --chip-ceremony-text: #6b5344;
  --chip-sangeet: #1a4d3a;
  --chip-sangeet-text: #d4f0e4;
  --chip-haldi: #e8a020;
  --chip-haldi-text: #4a3010;
  --chip-welcome: #1a4a6e;
  --chip-welcome-text: #d4e8f4;
  --modal-overlay: rgba(26, 40, 48, 0.45);
  --btn-primary-fg: #faf6ee;
  --font-display: 'Cormorant Garamond', Georgia, serif;
  --font-body: 'Lora', Georgia, serif;
}

/* ── Midnight (dark · soft mauve-teal, not espresso) ── */
html.dark,
html[data-theme="midnight"] {
  --ground: #1a2830;
  --surface: #243038;
  --surface2: #2a3d45;
  --border: #3a5058;
  --text: #d4c8cc;
  --text-strong: #f0e8ea;
  --muted: #9a9094;
  --accent: #c9a84c;
  --accent-hover: #dbb85e;
  --link: #5aadbe;
  --link-hover: #7ec4d4;
  --display: #f0e8ea;
  --ok: #6aab7a;
  --warn: #d4a840;
  --bad: #c86868;
  --chip-ceremony: #4a4038;
  --chip-ceremony-text: #e8dcc8;
  --chip-sangeet: #1a4d3a;
  --chip-sangeet-text: #a8e0c8;
  --chip-haldi: #6a4810;
  --chip-haldi-text: #f0d080;
  --chip-welcome: #1a3a58;
  --chip-welcome-text: #a8d0e8;
  --modal-overlay: rgba(10, 18, 22, 0.72);
  --btn-primary-fg: #1a2830;
}

/* ── Turmeric (warm light) ── */
html[data-theme="turmeric"] {
  --ground: #fff8e8;
  --surface: #fffcf4;
  --surface2: #f5ecd0;
  --border: #e8d4a0;
  --text: #6b4a20;
  --text-strong: #4a3010;
  --muted: #9a7840;
  --accent: #d4880a;
  --accent-hover: #b87408;
  --link: #2a6a5a;
  --link-hover: #1f5248;
  --display: #4a3010;
  --chip-ceremony: #f0e0c0;
  --chip-ceremony-text: #5c4020;
  --chip-sangeet: #2a5a40;
  --chip-sangeet-text: #d8f0e0;
  --chip-haldi: #e8a020;
  --chip-haldi-text: #3a2008;
  --chip-welcome: #2a5a78;
  --chip-welcome-text: #d0e8f4;
  --modal-overlay: rgba(74, 48, 16, 0.4);
  --btn-primary-fg: #fff8e8;
}

/* ── Peacock (cool light · sangeet energy) ── */
html[data-theme="peacock"] {
  --ground: #eef4f6;
  --surface: #ffffff;
  --surface2: #e4eef0;
  --border: #c8d8dc;
  --text: #3a5058;
  --text-strong: #1a3840;
  --muted: #6a8088;
  --accent: #2a7b8e;
  --accent-hover: #1f6272;
  --link: #1a4d3a;
  --link-hover: #0f3828;
  --display: #1a3840;
  --chip-ceremony: #e8e0d4;
  --chip-ceremony-text: #5a4840;
  --chip-sangeet: #1a4d3a;
  --chip-sangeet-text: #c8f0dc;
  --chip-haldi: #d4880a;
  --chip-haldi-text: #3a2008;
  --chip-welcome: #1a5a78;
  --chip-welcome-text: #c8e4f4;
  --modal-overlay: rgba(26, 56, 64, 0.45);
  --btn-primary-fg: #eef4f6;
}

/* ── Base reset & typography ── */
*,
*::before,
*::after {
  box-sizing: border-box;
}

html,
body {
  height: 100%;
  margin: 0;
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.55;
  background: var(--ground);
  color: var(--text);
  -webkit-font-smoothing: antialiased;
}

.font-serif,
.font-display {
  font-family: var(--font-display);
}

a {
  color: var(--link);
  text-decoration: none;
}

a:hover {
  color: var(--link-hover);
  text-decoration: underline;
}

button {
  font: inherit;
  cursor: pointer;
}

/* No gradient text */
h1, h2, h3, .page-head h1, .card-val, .sb-mono, .gate-mono {
  background: none;
  -webkit-background-clip: unset;
  background-clip: unset;
  -webkit-text-fill-color: unset;
  color: var(--display);
}

/* ── App shell overrides ── */
html:not(.dark) {
  --bg: var(--ground);
  --cream: var(--display);
  --gold: var(--accent);
  --gold-dim: var(--muted);
}

html, body {
  background: var(--ground);
  color: var(--text);
  font-family: var(--font-body);
}

.sidebar {
  background: var(--surface);
  border-right: 1px solid var(--border);
}

.sb-mono,
.gate-mono,
.page-head h1,
.section-title,
.card-val,
.v-card h3 {
  font-family: var(--font-display);
  color: var(--display);
}

.sb-link.on {
  color: var(--accent);
}

.card,
.v-card,
.k-col,
.contact-row,
.task-item {
  background: var(--surface);
  border: 1px solid var(--border);
}

.banner {
  background: var(--surface2);
  border: 1px solid var(--border);
  color: var(--accent);
}

/* ── Event route accent chips ── */
.event-chip,
.route-chip {
  display: inline-block;
  font-family: var(--font-body);
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  padding: 3px 10px;
  border-radius: 4px;
  border: 1px solid transparent;
}

.chip-ceremony,
.event-chip[data-route="ceremony"] {
  background: var(--chip-ceremony);
  color: var(--chip-ceremony-text);
  border-color: var(--chip-ceremony);
}

.chip-sangeet,
.event-chip[data-route="sangeet"] {
  background: var(--chip-sangeet);
  color: var(--chip-sangeet-text);
  border-color: var(--chip-sangeet);
}

.chip-haldi,
.event-chip[data-route="haldi"] {
  background: var(--chip-haldi);
  color: var(--chip-haldi-text);
  border-color: var(--chip-haldi);
}

.chip-welcome,
.event-chip[data-route="welcome"] {
  background: var(--chip-welcome);
  color: var(--chip-welcome-text);
  border-color: var(--chip-welcome);
}

/* ── Toolbar ── */
.crud-toolbar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
  margin-bottom: 20px;
  padding-bottom: 16px;
  border-bottom: 1px solid var(--border);
}

.crud-toolbar .toolbar-title {
  flex: 1;
  min-width: 140px;
  font-family: var(--font-display);
  font-size: 14px;
  color: var(--muted);
  letter-spacing: 0.04em;
}

.crud-toolbar .toolbar-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
}

/* ── Buttons ── */
.btn-primary {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 10px 18px;
  border: 1px solid var(--accent);
  border-radius: 6px;
  background: var(--accent);
  color: var(--btn-primary-fg);
  font-family: var(--font-body);
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 0.02em;
  transition: background 0.15s, border-color 0.15s;
}

.btn-primary:hover {
  background: var(--accent-hover);
  border-color: var(--accent-hover);
}

.btn-ghost {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 9px 16px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: transparent;
  color: var(--text);
  font-family: var(--font-body);
  font-size: 13px;
  font-weight: 500;
  transition: background 0.15s, border-color 0.15s, color 0.15s;
}

.btn-ghost:hover {
  background: var(--surface2);
  border-color: var(--muted);
  color: var(--text-strong);
}

.btn-ghost.btn-danger {
  color: var(--bad);
  border-color: var(--bad);
}

.btn-ghost.btn-danger:hover {
  background: var(--bad);
  color: var(--surface);
}

.btn-icon {
  padding: 6px 10px;
  font-size: 12px;
}

/* ── Forms ── */
.crud-form {
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.form-row {
  display: flex;
  flex-direction: column;
  gap: 5px;
}

.form-row label {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--muted);
}

.form-row input,
.form-row select,
.form-row textarea {
  width: 100%;
  padding: 10px 12px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--surface);
  color: var(--text-strong);
  font-family: var(--font-body);
  font-size: 14px;
}

.form-row input:focus,
.form-row select:focus,
.form-row textarea:focus {
  outline: 2px solid var(--link);
  outline-offset: 1px;
  border-color: var(--link);
}

.form-row textarea {
  min-height: 72px;
  resize: vertical;
}

.form-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 14px;
}

@media (max-width: 560px) {
  .form-grid {
    grid-template-columns: 1fr;
  }
}

.form-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  justify-content: flex-end;
  margin-top: 8px;
  padding-top: 16px;
  border-top: 1px solid var(--border);
}

/* ── Modal ── */
.modal-backdrop {
  position: fixed;
  inset: 0;
  z-index: 10000;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  background: var(--modal-overlay);
}

.modal-backdrop[hidden] {
  display: none;
}

.modal-panel {
  width: 100%;
  max-width: 520px;
  max-height: calc(100vh - 48px);
  overflow-y: auto;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
}

.modal-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 18px 20px;
  border-bottom: 1px solid var(--border);
}

.modal-head h2 {
  margin: 0;
  font-family: var(--font-display);
  font-size: 22px;
  font-weight: 600;
  color: var(--display);
}

.modal-close {
  padding: 4px 10px;
  border: 1px solid var(--border);
  border-radius: 4px;
  background: transparent;
  color: var(--muted);
  font-size: 18px;
  line-height: 1;
}

.modal-close:hover {
  color: var(--text-strong);
  background: var(--surface2);
}

.modal-body {
  padding: 20px;
}

/* ── CRUD row actions ── */
.crud-row-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 10px;
}

.v-card.local-item,
.contact-row.local-item,
tr.local-item {
  border-left: 3px solid var(--accent);
}

.local-badge {
  display: inline-block;
  font-size: 9px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  padding: 2px 6px;
  border-radius: 3px;
  background: var(--surface2);
  color: var(--accent);
  border: 1px solid var(--border);
  margin-left: 6px;
}

/* ── Theme picker ── */
.theme-picker {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-bottom: 12px;
}

.theme-picker-label {
  font-size: 10px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--muted);
  font-weight: 600;
}

.theme-swatches {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 6px;
}

.theme-swatch {
  padding: 8px 4px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--surface2);
  color: var(--text);
  font-family: var(--font-body);
  font-size: 10px;
  letter-spacing: 0.04em;
  text-align: center;
  transition: border-color 0.15s, background 0.15s;
}

.theme-swatch:hover {
  border-color: var(--accent);
}

.theme-swatch.active {
  border-color: var(--accent);
  background: var(--surface);
  color: var(--accent);
  font-weight: 600;
}

.theme-swatch[data-theme="ivory"]::before {
  content: '';
  display: block;
  width: 100%;
  height: 8px;
  margin-bottom: 4px;
  border-radius: 2px;
  background: linear-gradient(90deg, #faf6ee 50%, #c9a84c 50%);
}

.theme-swatch[data-theme="midnight"]::before {
  content: '';
  display: block;
  width: 100%;
  height: 8px;
  margin-bottom: 4px;
  border-radius: 2px;
  background: linear-gradient(90deg, #1a2830 50%, #c9a84c 50%);
}

.theme-swatch[data-theme="turmeric"]::before {
  content: '';
  display: block;
  width: 100%;
  height: 8px;
  margin-bottom: 4px;
  border-radius: 2px;
  background: linear-gradient(90deg, #fff8e8 50%, #d4880a 50%);
}

.theme-swatch[data-theme="peacock"]::before {
  content: '';
  display: block;
  width: 100%;
  height: 8px;
  margin-bottom: 4px;
  border-radius: 2px;
  background: linear-gradient(90deg, #eef4f6 50%, #2a7b8e 50%);
}

.mode-toggle {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 12px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--surface2);
  color: var(--text);
  width: 100%;
  margin-bottom: 8px;
  font-size: 12px;

/* ── Status badges (flat) ── */
.badge {
  border-radius: 4px;
}

.b-ok { background: color-mix(in srgb, var(--ok) 18%, transparent); color: var(--ok); }

.b-bad { background: color-mix(in srgb, var(--bad) 18%, transparent); color: var(--bad); }
.b-muted { background: var(--surface2); color: var(--muted); }

.gate-input {

}

<script>
const PW_HASH = 'fda7173eb96e0c7529f236fe306cea4e8a84703db6b6f212f59379e8ed68a411';
const SESSION = 'bc_cmd_auth';
let DATA = null;

const RENDERERS = {};

async function sha256Hex(text) {
  const buf = new TextEncoder().encode(text);
  const hash = await crypto.subtle.digest('SHA-256', buf);
  return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2, '0')).join('');
}

function esc(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function fmtDate(iso) {
  if (!iso) return '—';
  const d = new Date(iso + 'T12:00:00');
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', weekday: 'short' });
}

function fmtShort(iso) {
  if (!iso) return { d: '—', m: '' };
  const d = new Date(iso + 'T12:00:00');
  return { d: d.getDate(), m: d.toLocaleDateString('en-US', { month: 'short' }) };
}

function route() {
  const h = location.hash.replace(/^#\/?/, '') || 'dashboard';
  return h.split('/')[0] || 'dashboard';
}

function setActiveNav(r) {
  document.querySelectorAll('[data-route]').forEach(el => {
    el.classList.toggle('on', el.dataset.route === r);
  });
}

function checkPw() {
  const v = document.getElementById('gate-pw').value;
  const err = document.getElementById('gate-err');
  err.textContent = '';
  sha256Hex(v).then(function(got) {
    if (got === PW_HASH) {
      try { sessionStorage.setItem(SESSION, '1'); } catch (e) {}
      initApp();
    } else {
      err.textContent = 'Incorrect password';
    }
  }).catch(function() {
    err.textContent = 'Could not verify password';
  });
}

function toggleSidebar() {
  document.querySelector('.sidebar').classList.toggle('open');
}

document.getElementById('gate-btn').addEventListener('click', checkPw);
document.getElementById('gate-pw').addEventListener('keydown', e => { if (e.key === 'Enter') checkPw(); });
document.getElementById('menu-btn').addEventListener('click', toggleSidebar);
document.querySelectorAll('[data-route]').forEach(el => {
  el.addEventListener('click', () => { document.querySelector('.sidebar').classList.remove('open'); });
});
const TASK_STORAGE_KEY = 'bc_cmd_tasks';
const TASK_STATUSES = ['todo', 'in_progress', 'done'];

function emptyTaskState() {
  return { edits: {}, added: [], deleted: [] };
}

function loadTaskState() {
  try {
    const raw = sessionStorage.getItem(TASK_STORAGE_KEY);
    if (!raw) return emptyTaskState();
    const parsed = JSON.parse(raw);
    return {
      edits: parsed.edits && typeof parsed.edits === 'object' ? parsed.edits : {},
      added: Array.isArray(parsed.added) ? parsed.added : [],
      deleted: Array.isArray(parsed.deleted) ? parsed.deleted : [],
    };
  } catch (e) {
    return emptyTaskState();
  }
}

function saveTaskState(state) {
  const payload = state || loadTaskState();
  try {
    sessionStorage.setItem(TASK_STORAGE_KEY, JSON.stringify({
      edits: payload.edits || {},
      added: payload.added || [],
      deleted: payload.deleted || [],
    }));
  } catch (e) { /* quota / private mode */ }
}

function bucketDefaultStatus(bucket) {
  const b = String(bucket || '').toLowerCase();
  if (b === 'urgent') return 'todo';
  if (b === 'thisweek' || b === 'this_week' || b === 'this week') return 'in_progress';
  if (b === 'sprint') return 'done';
  return 'todo';
}

function statusFromRaw(raw) {
  const s = String(raw || '').toLowerCase().replace(/\s+/g, '_');
  if (s === 'done' || s === 'closed' || s === 'complete' || s === 'completed') return 'done';
  if (s === 'in_progress' || s === 'inprogress' || s === 'progress' || s === 'active' || s === 'tmrw' || s === 'tomorrow') return 'in_progress';
  if (s === 'milestone') return 'done';
  if (s === 'todo' || s === 'open' || s === 'pending' || s === 'new') return 'todo';
  return '';
}

function normalizeStatus(t) {
  if (!t) return 'todo';
  const explicit = statusFromRaw(t.status);
  if (explicit) return explicit;
  return bucketDefaultStatus(t.bucket);
}

function resolveBaseId(t, index) {
  return t.id != null && t.id !== '' ? String(t.id) : 'ssot-' + index;
}

function getMergedTasks(baseTasks) {
  const state = loadTaskState();
  const deleted = new Set((state.deleted || []).map(String));
  const merged = [];

  (baseTasks || []).forEach((base, index) => {
    const id = resolveBaseId(base, index);
    if (deleted.has(id)) return;
    const edit = state.edits[id] || {};
    const row = Object.assign({}, base, edit, { id });
    row.status = normalizeStatus(row);
    merged.push(row);
  });

  for (const added of state.added || []) {
    if (!added || !added.id || deleted.has(String(added.id))) continue;
    const row = Object.assign({}, added);
    row.status = normalizeStatus(row);
    merged.push(row);
  }

  return merged;
}

function findMergedTask(id) {
  return getMergedTasks(DATA.tasks || []).find(t => String(t.id) === String(id));
}

function isLocalTaskId(id) {
  return String(id).startsWith('local-');
}

function patchTaskState(mutator) {
  const state = loadTaskState();
  mutator(state);
  saveTaskState(state);
}

function setTaskField(id, fields) {
  patchTaskState(state => {
    if (isLocalTaskId(id)) {
      const idx = state.added.findIndex(t => String(t.id) === String(id));
      if (idx >= 0) Object.assign(state.added[idx], fields);
      return;
    }
    state.edits[id] = Object.assign({}, state.edits[id] || {}, fields);
  });
}

function cycleStatus(id) {
  const t = findMergedTask(id);
  if (!t) return;
  const order = TASK_STATUSES;
  const cur = normalizeStatus(t);
  const next = order[(order.indexOf(cur) + 1) % order.length];
  setTaskField(id, { status: next });
  saveTaskState();
  refreshStats();
  render();
}

function toggleTaskDone(id) {
  const t = findMergedTask(id);
  if (!t) return;
  const next = normalizeStatus(t) === 'done' ? 'todo' : 'done';
  setTaskField(id, { status: next });
  saveTaskState();
  refreshStats();
  render();
}

function addTask(fields) {
  const owner = String(fields?.owner || '').trim();
  const task = String(fields?.task || '').trim();
  if (!task) return false;
  const priority = String(fields?.priority || 'medium').toLowerCase();
  let bucket = 'thisWeek';
  if (priority === 'urgent' || priority === 'high') bucket = 'urgent';
  else if (priority === 'low' || priority === 'sprint') bucket = 'sprint';

  const row = {
    id: 'local-' + Date.now() + '-' + Math.random().toString(36).slice(2, 7),
    owner: owner || 'Baji',
    task,
    due: fields?.due || '',
    bucket,
    priority,
    status: 'todo',
  };

  patchTaskState(state => {
    state.added.push(row);
  });
  saveTaskState();
  refreshStats();
  render();
  return true;
}

function deleteTask(id) {
  const sid = String(id);
  patchTaskState(state => {
    if (isLocalTaskId(sid)) {
      state.added = state.added.filter(t => String(t.id) !== sid);
      return;
    }
    if (!state.deleted.includes(sid)) state.deleted.push(sid);
    delete state.edits[sid];
  });
  saveTaskState();
  refreshStats();
  render();
}

function csvCell(val) {
  const s = String(val ?? '');
  if (/[",\n\r]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
  return s;
}

function exportTasksCsv() {
  const tasks = getMergedTasks(DATA.tasks || []);
  const headers = ['id', 'owner', 'task', 'due', 'status', 'bucket', 'priority'];
  const lines = [headers.join(',')].concat(
    tasks.map(t => headers.map(h => csvCell(t[h])).join(','))
  );
  const blob = new Blob([lines.join('\r\n')], { type: 'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'bc-wedding-tasks-' + new Date().toISOString().slice(0, 10) + '.csv';
  a.style.display = 'none';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function exportTaskSyncBundle() {
  const state = loadTaskState();
  const merged = getMergedTasks(DATA.tasks || []);
  const payload = {
    exportedAt: new Date().toISOString(),
    source: 'CB_Command_Center_App',
    edits: state.edits,
    added: state.added,
    deleted: state.deleted,
    mergedTasks: merged.map(t => ({
      id: t.id,
      owner: t.owner,
      task: t.task,
      due: t.due,
      status: normalizeStatus(t),
      bucket: t.bucket,
      priority: t.priority,
    })),
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'task-sync-overlay.json';
  a.style.display = 'none';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function resetLocalTaskChanges() {
  try {
    sessionStorage.removeItem(TASK_STORAGE_KEY);
  } catch (e) { /* ignore */ }
  refreshStats();
  render();
}

function hasLocalTaskChanges() {
  const s = loadTaskState();
  return Object.keys(s.edits).length > 0 || s.added.length > 0 || s.deleted.length > 0;
}

function refreshStats() {
  if (!DATA || !DATA.stats) return;
  const tasks = getMergedTasks(DATA.tasks || []);
  const open = tasks.filter(t => normalizeStatus(t) !== 'done');
  DATA.stats.openTasks = open.length;
  DATA.stats.urgentTasks = tasks.filter(
    t => String(t.bucket || '').toLowerCase() === 'urgent' && normalizeStatus(t) !== 'done'
  ).length;
}

function todayIso() {
  return new Date().toISOString().slice(0, 10);
}

function statusLabel(st) {
  if (st === 'in_progress') return 'In progress';
  if (st === 'done') return 'Done';
  return 'Todo';
}

function renderStatusSelect(id, st) {
  return '<select class="task-status-select" data-action="task-status" data-task-id="' + esc(id) + '" aria-label="Task status">' +
    TASK_STATUSES.map(s =>
      '<option value="' + s + '"' + (s === st ? ' selected' : '') + '>' + statusLabel(s) + '</option>'
    ).join('') +
    '</select>';
}

function renderTaskCard(t, opts) {
  const compact = !!(opts && opts.compact);
  const st = normalizeStatus(t);
  const overdue = t.due && t.due < todayIso() && st !== 'done';
  const checked = st === 'done';
  const id = esc(t.id);
  const controls = compact
    ? '<input type="checkbox" class="task-check" data-action="task-toggle" data-task-id="' + id + '"' +
      (checked ? ' checked' : '') + ' aria-label="Mark task done">'
    : '<input type="checkbox" class="task-check" data-action="task-toggle" data-task-id="' + id + '"' +
      (checked ? ' checked' : '') + ' aria-label="Mark task done">' +
      renderStatusSelect(t.id, st) +
      '<button type="button" class="task-del-btn" data-action="task-delete" data-task-id="' + id + '" aria-label="Delete task" title="Delete">×</button>';

  return '<div class="task-item' + (overdue ? ' overdue' : '') + (checked ? ' done' : '') + '" data-task-id="' + id + '">' +
    controls +
    '<div class="task-body">' +
    '<span class="badge b-muted">' + esc(t.bucket || '—') + '</span> ' +
    '<strong>' + esc(t.owner) + '</strong>' +
    '<div style="margin-top:6px' + (checked ? ';text-decoration:line-through;opacity:.75' : '') + '">' + esc(t.task) + '</div>' +
    (t.due ? '<div style="font-size:11px;color:var(--muted);margin-top:4px">Due ' + esc(t.due) + '</div>' : '') +
    '</div></div>';
}

function renderDashboard() {
  const s = DATA.stats;
  const days = s.daysUntilWedding;
  const daysLabel = days > 0 ? days + ' days until the ceremony' : days === 0 ? 'The day has arrived!' : 'Celebration complete';
  const alerts = (DATA.alerts || []).slice(0, 5).map(a =>
    '<div class="alert ' + esc(a.level) + '">' + esc(a.text) + '</div>'
  ).join('');
  const upcoming = (DATA.events || []).slice(0, 4).map(e => {
    const { d, m } = fmtShort(e.date);
    const key = e.date === '2026-06-20' || e.date === '2026-06-21';
    return '<div class="event-row' + (key ? ' key' : '') + '">' +
      '<div class="date-badge"><div class="d">' + d + '</div><div class="m">' + m + '</div></div>' +
      '<div><strong>' + esc(e.name) + '</strong><div style="font-size:12px;color:var(--muted);margin-top:4px">' +
      esc(e.time || '') + ' · ' + esc(e.venue) + '</div></div></div>';
  }).join('');
  const merged = getMergedTasks(DATA.tasks || []);
  const priorityTasks = merged
    .filter(t => String(t.bucket || '').toLowerCase() === 'urgent')
    .slice(0, 6);
  const tasksHtml = priorityTasks.length
    ? priorityTasks.map(t => renderTaskCard(t, { compact: true })).join('')
    : '<p style="color:var(--muted)">None</p>';
  const paidPct = s.totalBudgetUsd ? Math.round((s.paidBudgetUsd / s.totalBudgetUsd) * 100) : s.budgetPaidPct;
  const openCount = s.openTasks != null ? s.openTasks : merged.filter(t => normalizeStatus(t) !== 'done').length;

  return '<div class="page-head"><h1 class="font-serif">Wedding Command Center</h1>' +
    '<p>Bharadwaj &amp; Catherina · Grand Palladium, Cancún · June 20, 2026</p></div>' +
    '<div class="banner">' + esc(days > 0 ? days + ' days to go' : daysLabel) +
    ' · Hindu Ceremony · June 20 · 7:55 AM · Glassroom</div>' +
    (alerts ? '<div class="alert-list">' + alerts + '</div>' : '') +
    '<div class="grid-4">' +
    '<div class="card"><div class="card-label">Days Until</div><div class="card-val">' + (days > 0 ? days : '✦') + '</div><div style="font-size:12px;color:var(--muted)">' + esc(daysLabel) + '</div></div>' +
    '<div class="card"><div class="card-label">Urgent Tasks</div><div class="card-val">' + s.urgentTasks + '</div>' +
    '<div style="font-size:12px;color:var(--muted);margin-top:6px">' + openCount + ' open overall</div>' +
    '<div class="progress"><span style="width:' + Math.min(100, s.urgentTasks * 10) + '%"></span></div></div>' +
    '<div class="card"><div class="card-label">Active Vendors</div><div class="card-val">' + s.activeVendors + '/' + s.totalVendors + '</div></div>' +
    '<div class="card"><div class="card-label">Budget Paid</div><div class="card-val">' + paidPct + '%</div><div class="progress"><span style="width:' + paidPct + '%"></span></div></div>' +
    '</div>' +
    '<div class="section-title font-serif">Upcoming Events</div><div class="card">' + (upcoming || '<p style="color:var(--muted)">No events</p>') + '</div>' +
    '<div class="section-title font-serif">Priority Tasks</div><div class="task-list" data-task-list="dashboard">' + tasksHtml + '</div>' +
    (s.lastLiveRefresh ? '<p class="live-pill">Live stats · refreshed <strong>' + esc(new Date(s.lastLiveRefresh).toLocaleTimeString()) + '</strong></p>' : '');
}

function renderTasks() {
  const merged = getMergedTasks(DATA.tasks || []);
  const cols = { todo: [], in_progress: [], done: [] };
  for (const t of merged) {
    const st = normalizeStatus(t);
    if (st === 'done') cols.done.push(t);
    else if (st === 'in_progress') cols.in_progress.push(t);
    else cols.todo.push(t);
  }

  function col(title, items) {
    return '<div class="k-col"><h3>' + title + ' (' + items.length + ')</h3>' +
      '<div class="task-list">' +
      (items.length ? items.map(t => renderTaskCard(t)).join('') : '<p style="color:var(--muted);font-size:12px">No tasks</p>') +
      '</div></div>';
  }

  const localHint = hasLocalTaskChanges()
    ? '<span class="badge b-warn" style="margin-left:8px">Local edits</span>'
    : '';

  return '<div class="page-head"><h1 class="font-serif">Task Tracker</h1><p>' + merged.length + ' items · SSOT + session overrides' + localHint + '</p></div>' +
    '<div class="task-toolbar" style="display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:16px">' +
    '<button type="button" class="btn-primary" style="width:auto" data-action="task-add-toggle" data-testid="task-add-toggle">+ Add Task</button>' +
    '<button type="button" class="theme-btn" style="width:auto;margin:0" data-action="task-export-csv" data-testid="task-export-csv">Export CSV</button>' +
    '<button type="button" class="theme-btn" style="width:auto;margin:0" data-action="task-export-sync" data-testid="task-export-sync">Export sync bundle</button>' +
    '<button type="button" class="theme-btn" style="width:auto;margin:0" data-action="task-reset" data-testid="task-reset">Reset local changes</button>' +
    '</div>' +
    '<form id="task-add-form" class="card" style="display:none;margin-bottom:16px" data-task-form="add">' +
    '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px">' +
    '<label style="font-size:12px;color:var(--muted)">Owner<input name="owner" class="gate-input" style="margin-top:4px" placeholder="Baji" data-testid="task-add-owner"></label>' +
    '<label style="font-size:12px;color:var(--muted)">Task<input name="task" class="gate-input" style="margin-top:4px" required placeholder="What needs doing?" data-testid="task-add-task"></label>' +
    '<label style="font-size:12px;color:var(--muted)">Due<input name="due" type="date" class="gate-input" style="margin-top:4px" data-testid="task-add-due"></label>' +
    '<label style="font-size:12px;color:var(--muted)">Priority<select name="priority" class="gate-input" style="margin-top:4px" data-testid="task-add-priority">' +
    '<option value="urgent">Urgent</option><option value="high">High</option><option value="medium" selected>Medium</option><option value="low">Low</option></select></label>' +
    '</div>' +
    '<div style="display:flex;gap:10px;margin-top:12px">' +
    '<button type="submit" class="gate-btn" style="width:auto;padding:10px 18px" data-action="task-add-submit" data-testid="task-add-submit">Save task</button>' +
    '<button type="button" class="theme-btn" style="width:auto;margin:0" data-action="task-add-cancel">Cancel</button>' +
    '</div></form>' +
    '<div class="kanban" data-task-board="kanban">' +
    col('Todo', cols.todo) + col('In progress', cols.in_progress) + col('Done', cols.done) +
    '</div>';
}

let taskEventsBound = false;

function handleTaskClick(e) {
  const actionEl = e.target.closest('[data-action]');
  if (!actionEl) return;
  const action = actionEl.dataset.action;

  if (action === 'task-add-toggle') {
    const form = document.getElementById('task-add-form');
    if (form) form.style.display = form.style.display === 'none' ? 'block' : 'none';
    return;
  }
  if (action === 'task-add-cancel') {
    const form = document.getElementById('task-add-form');
    if (form) {
      form.style.display = 'none';
      form.reset();
    }
    return;
  }
  if (action === 'task-export-csv') {
    exportTasksCsv();
    return;
  }
  if (action === 'task-export-sync') {
    exportTaskSyncBundle();
    return;
  }
  if (action === 'task-reset') {
    if (confirm('Clear all local task edits, additions, and deletions? SSOT data in the page is unchanged.')) {
      resetLocalTaskChanges();
    }
    return;
  }
  if (action === 'task-delete') {
    const id = actionEl.dataset.taskId;
    if (id && confirm('Remove this task from your local view?')) deleteTask(id);
    return;
  }
  if (action === 'task-toggle') {
    const id = actionEl.dataset.taskId;
    if (id) toggleTaskDone(id);
  }
}

function handleTaskChange(e) {
  const el = e.target.closest('[data-action="task-status"]');
  if (!el) return;
  const id = el.dataset.taskId;
  const status = el.value;
  if (!id || !TASK_STATUSES.includes(status)) return;
  setTaskField(id, { status });
  saveTaskState();
  refreshStats();
  render();
}

function handleTaskSubmit(e) {
  const form = e.target.closest('#task-add-form');
  if (!form) return;
  e.preventDefault();
  const fd = new FormData(form);
  const ok = addTask({
    owner: fd.get('owner'),
    task: fd.get('task'),
    due: fd.get('due'),
    priority: fd.get('priority'),
  });
  if (ok) {
    form.reset();
    form.style.display = 'none';
  }
}

function bindTaskEvents() {
  const main = document.getElementById('main');
  if (!main) return;
  if (!taskEventsBound) {
    main.addEventListener('click', handleTaskClick);
    main.addEventListener('change', handleTaskChange);
    main.addEventListener('submit', handleTaskSubmit);
    taskEventsBound = true;
  }
}

function render() {
  const r = route();
  setActiveNav(r);
  const fn = RENDERERS[r] || RENDERERS.dashboard;
  document.getElementById('main').innerHTML = fn();
  document.title = 'B & C Command Center · ' + r.charAt(0).toUpperCase() + r.slice(1);
  bindTaskEvents();
}

function initApp() {
  try {
    const el = document.getElementById('wedding-data');
    DATA = JSON.parse(el.textContent);
    window.DATA = DATA;
  } catch (e) {
    document.getElementById('main').innerHTML = '<p>Failed to load data.</p>';
    return;
  }
  refreshStats();
  window.RENDERERS = RENDERERS;
  RENDERERS.dashboard = renderDashboard;
  RENDERERS.tasks = renderTasks;
  if (typeof BcCmdPages !== 'undefined') BcCmdPages.initPhase6Pages();
  if (typeof BcCmdCrud !== 'undefined') BcCmdCrud.initPhase4Crud();
  if (typeof BcCmdVendors !== 'undefined') BcCmdVendors.initPhase7Vendors();
  if (typeof BcCmdLive !== 'undefined') BcCmdLive.initPhase7Live();
  document.getElementById('gate').style.display = 'none';
  document.getElementById('app').classList.add('ready');
  if (!window.__bcHashBound) {
    window.addEventListener('hashchange', render);
    window.__bcHashBound = true;
  }
  render();
}

window.render = render;
window.initApp = initApp;
window.route = route;
window.setTaskField = setTaskField;
window.saveTaskState = saveTaskState;
window.renderTaskCard = renderTaskCard;
window.refreshStats = refreshStats;
</script>
<script>/**
 * Phase 4 — Client-side CRUD overlay for Command Center
 * sessionStorage keys: bc_cmd_vendors | budget | contacts | events
 * Merge local layer with embedded DATA on load.
 */
(function (global) {
  'use strict';

  const KEYS = {
    vendors: 'bc_cmd_vendors',
    budget: 'bc_cmd_budget',
    contacts: 'bc_cmd_contacts',
    events: 'bc_cmd_events',
    theme: 'bc_cmd_theme',
    dark: 'bc_cmd_dark',
  };

  const ID_PREFIX = 'local-';

  function esc(s) {
    return String(s ?? '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function fmtDate(iso) {
    if (!iso) return '—';
    const d = new Date(iso + 'T12:00:00');
    return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', weekday: 'short' });
  }

  function fmtShort(iso) {
    if (!iso) return { d: '—', m: '' };
    const d = new Date(iso + 'T12:00:00');
    return { d: d.getDate(), m: d.toLocaleDateString('en-US', { month: 'short' }) };
  }

  function loadLayer(key) {
    try {
      const raw = sessionStorage.getItem(key);
      return raw ? JSON.parse(raw) : [];
    } catch {
      return [];
    }
  }

  function saveLayer(key, arr) {
    sessionStorage.setItem(key, JSON.stringify(arr));
  }

  function newLocalId() {
    return ID_PREFIX + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  }

  function stripMeta(item) {
    const out = { ...item };
    delete out._updated;
    delete out._deleted;
    delete out._added;
    delete out._source;
    return out;
  }

  function mergeList(baseItems, layer, idPrefix) {
    const base = (baseItems || []).map((item, i) => ({
      ...item,
      id: item.id != null ? String(item.id) : `${idPrefix}-${i}`,
      _source: 'master',
    }));
    const deleted = new Set(layer.filter((x) => x._deleted).map((x) => String(x.id)));
    const updates = new Map(
      layer.filter((x) => x._updated && !x._deleted).map((x) => [String(x.id), x])
    );
    const added = layer.filter((x) => String(x.id || '').startsWith(ID_PREFIX) && !x._deleted);

    const merged = base
      .filter((x) => !deleted.has(x.id))
      .map((x) => (updates.has(x.id) ? { ...x, ...stripMeta(updates.get(x.id)), _source: x._source } : x));

    return [...merged, ...added.map((x) => ({ ...stripMeta(x), _source: 'local' }))];
  }

  function pushLayer(key, record) {
    const layer = loadLayer(key);
    layer.push(record);
    saveLayer(key, layer);
  }

  function upsertLayer(key, id, patch, flags) {
    const layer = loadLayer(key);
    const sid = String(id);
    if (sid.startsWith(ID_PREFIX)) {
      const idx = layer.findIndex((x) => String(x.id) === sid);
      if (idx >= 0) {
        layer[idx] = { ...layer[idx], ...patch, id: sid, ...flags };
      } else {
        layer.push({ ...patch, id: sid, ...flags });
      }
    } else {
      const idx = layer.findIndex((x) => String(x.id) === sid && x._updated);
      const record = { ...patch, id: sid, ...flags };
      if (idx >= 0) layer[idx] = { ...layer[idx], ...record };
      else layer.push(record);
    }
    saveLayer(key, layer);
  }

  function removeFromLayer(key, id) {
    const sid = String(id);
    let layer = loadLayer(key);
    if (sid.startsWith(ID_PREFIX)) {
      layer = layer.filter((x) => String(x.id) !== sid);
    } else {
      layer = layer.filter((x) => !(String(x.id) === sid && x._updated));
      layer.push({ id: sid, _deleted: true });
    }
    saveLayer(key, layer);
  }

  function toCsv(rows, columns) {
    const escCell = (v) => {
      const s = v == null ? '' : String(v);
      return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
    };
    const header = columns.map((c) => escCell(c.label)).join(',');
    const body = rows
      .map((row) => columns.map((c) => escCell(typeof c.value === 'function' ? c.value(row) : row[c.key])).join(','))
      .join('\n');
    return header + '\n' + body;
  }

  function downloadText(filename, text, mime) {
    const blob = new Blob([text], { type: mime || 'text/plain;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    a.click();
    URL.revokeObjectURL(url);
  }

  function eventRoute(name) {
    const n = String(name || '').toLowerCase();
    if (/ceremony|wedding|muhurtham|reception|patravali|baraat|pooja|maticoor|snathakam/i.test(n)) {
      if (/sangeet/i.test(n)) return 'sangeet';
      if (/haldi/i.test(n)) return 'haldi';
      if (/welcome|arrival/i.test(n)) return 'welcome';
      if (/ceremony|wedding|muhurtham/i.test(n)) return 'ceremony';
    }
    if (/sangeet/i.test(n)) return 'sangeet';
    if (/haldi|mehndi/i.test(n)) return 'haldi';
    if (/welcome|arrival/i.test(n)) return 'welcome';
    if (/ceremony|wedding|reception|baraat/i.test(n)) return 'ceremony';
    return '';
  }

  function eventChipHtml(name) {
    const route = eventRoute(name);
    if (!route) return '';
    return `<span class="event-chip chip-${route}" data-route="${route}">${esc(route)}</span>`;
  }

  function toolbarHtml(entityLabel, entityKey) {
    return (
      `<div class="crud-toolbar" data-entity="${esc(entityKey)}">` +
      `<span class="toolbar-title">${esc(entityLabel)} · local edits in this session</span>` +
      `<div class="toolbar-actions">` +
      `<button type="button" class="btn-primary" data-crud-add="${esc(entityKey)}">+ Add</button>` +
      `<button type="button" class="btn-ghost" data-crud-export="${esc(entityKey)}">Export CSV</button>` +
      (entityKey === 'budget'
        ? `<button type="button" class="btn-ghost" data-budget-sync-export>Export sync bundle</button>`
        : '') +
      `<button type="button" class="btn-ghost" data-crud-backup>Backup JSON</button>` +
      `</div></div>`
    );
  }

  function rowActionsHtml(id) {
    return (
      `<div class="crud-row-actions">` +
      `<button type="button" class="btn-ghost btn-icon" data-crud-edit="${esc(id)}">Edit</button>` +
      `<button type="button" class="btn-ghost btn-icon btn-danger" data-crud-delete="${esc(id)}">Delete</button>` +
      `</div>`
    );
  }

  function localBadge(item) {
    return item._source === 'local' || String(item.id || '').startsWith(ID_PREFIX)
      ? '<span class="local-badge">local</span>'
      : '';
  }

  /* ── Public merge getters ── */
  function getMergedVendors() {
    return mergeList(global.DATA?.vendors, loadLayer(KEYS.vendors), 'master-v');
  }

  function getMergedBudget() {
    return mergeList(global.DATA?.budget, loadLayer(KEYS.budget), 'master-b');

  function ensureModalDom() {
    if (document.getElementById('bc-crud-modal')) return;
    const el = document.createElement('div');
    el.id = 'bc-crud-modal';
    el.className = 'modal-backdrop';
    el.hidden = true;
    el.innerHTML =
      '<div class="modal-panel" role="dialog" aria-modal="true">' +
      '<div class="modal-head"><h2 id="bc-modal-title">Edit</h2>' +
      '<button type="button" class="modal-close" id="bc-modal-close" aria-label="Close">×</button></div>' +
      '<div class="modal-body"><form id="bc-modal-form" class="crud-form"></form></div></div>';
    document.body.appendChild(el);
    el.addEventListener('click', (e) => {
      if (e.target === el) hideModal();
    });
    document.getElementById('bc-modal-close').addEventListener('click', hideModal);
    document.getElementById('bc-modal-form').addEventListener('submit', onModalSubmit);
  }

  function findItem(entity, id) {
    const getters = {
      vendors: getMergedVendors,
      budget: getMergedBudget,
      contacts: getMergedContacts,
      events: getMergedEvents,
    };
    return (getters[entity]() || []).find((x) => String(x.id) === String(id));
  }

  function buildFormHtml(entity, item) {
    const fields = FORM_FIELDS[entity] || [];
    return fields
      .map((f) => {
        const val = item ? item[f.name] : '';
        const req = f.required ? ' required' : '';
        if (f.type === 'textarea') {
          return (
            `<div class="form-row"><label for="f-${f.name}">${esc(f.label)}</label>` +
            `<textarea id="f-${f.name}" name="${esc(f.name)}"${req}>${esc(val)}</textarea></div>`
          );
        }
        if (f.type === 'select') {
          const opts = (f.options || [])
            .map(
              (o) =>
                `<option value="${esc(o)}"${String(val) === o ? ' selected' : ''}>${esc(o)}</option>`
            )
            .join('');
          return (
            `<div class="form-row"><label for="f-${f.name}">${esc(f.label)}</label>` +
            `<select id="f-${f.name}" name="${esc(f.name)}"${req}>${opts}</select></div>`
          );
        }
        const type = f.type || 'text';
        const numVal = val != null && val !== '' ? val : '';
        return (
          `<div class="form-row"><label for="f-${f.name}">${esc(f.label)}</label>` +
          `<input id="f-${f.name}" name="${esc(f.name)}" type="${type}" value="${esc(numVal)}"${req}></div>`
        );
      })
      .join('') +
      '<div class="form-actions">' +
      '<button type="button" class="btn-ghost" id="bc-modal-cancel">Cancel</button>' +
      '<button type="submit" class="btn-primary">Save</button></div>';
  }

  function showModal(entity, item) {
    ensureModalDom();
    modalEntity = entity;
    modalItemId = item ? item.id : null;
    const backdrop = document.getElementById('bc-crud-modal');
    const title = document.getElementById('bc-modal-title');
    const form = document.getElementById('bc-modal-form');
    title.textContent = item ? `Edit ${entity.slice(0, -1)}` : `Add ${entity.slice(0, -1)}`;
    form.innerHTML = buildFormHtml(entity, item || null);
    form.querySelector('#bc-modal-cancel').addEventListener('click', hideModal);
    backdrop.hidden = false;
  }

  function hideModal() {
    const backdrop = document.getElementById('bc-crud-modal');
    if (backdrop) backdrop.hidden = true;
    modalEntity = null;
    modalItemId = null;
  }

  function readFormData(form) {
    const data = {};
    new FormData(form).forEach((v, k) => {
      if (k === 'usd' || k === 'cad') {
        data[k] = v === '' ? null : Number(v);
      } else {
        data[k] = v;
      }
    });
    return data;
  }

  function onModalSubmit(e) {
    e.preventDefault();
    const form = e.target;
    const data = readFormData(form);
    const ops = {
      vendors: { add: addVendor, update: updateVendor },
      budget: { add: addBudget, update: updateBudget },
      contacts: { add: addContact, update: updateContact },
      events: { add: addEvent, update: updateEvent },
    };
    const op = ops[modalEntity];
    if (!op) return;
    if (modalItemId) op.update(modalItemId, data);
    else op.add(data);
    hideModal();
    if (typeof global.render === 'function') global.render();
  }

  /* ── Theme picker ── */
  function applyTheme(themeId) {
    const html = document.documentElement;
    html.setAttribute('data-theme', themeId);
    try {
      sessionStorage.setItem(KEYS.theme, themeId);
    } catch (_) {}
    document.querySelectorAll('.theme-swatch').forEach((btn) => {
      btn.classList.toggle('active', btn.dataset.theme === themeId);
    });
  }

  function applyDarkMode(dark) {
    document.documentElement.classList.toggle('dark', dark);
    try {
      sessionStorage.setItem(KEYS.dark, dark ? '1' : '0');
    } catch (_) {}
  }

  function initThemePicker() {
    const foot = document.querySelector('.sb-foot');
    if (!foot || document.getElementById('bc-theme-picker')) return;

    const savedTheme = sessionStorage.getItem(KEYS.theme) || 'ivory';
    const savedDark = sessionStorage.getItem(KEYS.dark) === '1';
    applyTheme(savedTheme);
    applyDarkMode(savedDark);

    const picker = document.createElement('div');
    picker.id = 'bc-theme-picker';
    picker.className = 'theme-picker';
    picker.innerHTML =
      '<div class="theme-picker-label">Chromatic preset</div>' +
      '<div class="theme-swatches">' +
      ['ivory', 'midnight', 'turmeric', 'peacock']
        .map(
          (t) =>
            `<button type="button" class="theme-swatch${t === savedTheme ? ' active' : ''}" data-theme="${t}">${t}</button>`
        )
        .join('') +
      '</div>' +
      `<button type="button" class="mode-toggle" id="bc-mode-toggle">${savedDark ? '☀ Light mode' : '☾ Dark mode'}</button>`;

    const oldBtn = document.getElementById('theme-btn');
    if (oldBtn) oldBtn.remove();
    foot.insertBefore(picker, foot.firstChild);

    picker.querySelectorAll('.theme-swatch').forEach((btn) => {
      btn.addEventListener('click', () => {
        const t = btn.dataset.theme;
        if (t === 'midnight') {
          applyTheme('midnight');
          applyDarkMode(true);
        } else {
          applyTheme(t);
          applyDarkMode(false);
        }
        updateModeLabel();
      });
    });

    function updateModeLabel() {
      const toggle = document.getElementById('bc-mode-toggle');
      if (toggle) {
        toggle.textContent = document.documentElement.classList.contains('dark')
          ? '☀ Light mode'
          : '☾ Dark mode';
      }
    }

    document.getElementById('bc-mode-toggle').addEventListener('click', () => {
      const next = !document.documentElement.classList.contains('dark');
      applyDarkMode(next);
      if (next && !document.documentElement.getAttribute('data-theme')) applyTheme('midnight');
      updateModeLabel();
    });
  }

  /* ── CRUD click delegation ── */
  function bindCrudClicks() {
    const main = document.getElementById('main');
    if (!main || main.dataset.crudBound) return;
    main.dataset.crudBound = '1';

    main.addEventListener('click', (e) => {
      const addBtn = e.target.closest('[data-crud-add]');
      if (addBtn) {
        showModal(addBtn.dataset.crudAdd, null);
        return;
      }
      if (e.target.closest('[data-budget-sync-export]')) {
        exportBudgetSyncBundle();
        return;
      }
      const exportBtn = e.target.closest('[data-crud-export]');
      if (exportBtn) {
        const map = {
          vendors: exportVendorsCsv,
          budget: exportBudgetCsv,
          contacts: exportContactsCsv,
          events: exportEventsCsv,
        };
        (map[exportBtn.dataset.crudExport] || exportAllJson)();
        return;
      }
      if (e.target.closest('[data-crud-backup]')) {
        exportAllJson();
        return;
      }
      const editBtn = e.target.closest('[data-crud-edit]');
      if (editBtn) {
        const row = editBtn.closest('[data-id]');
        const entity = routeToEntity(currentRoute());
        const id = editBtn.dataset.crudEdit;
        const item = findItem(entity, id);
        if (item) showModal(entity, item);
        return;
      }
      const delBtn = e.target.closest('[data-crud-delete]');
      if (delBtn) {
        const entity = routeToEntity(currentRoute());
        const id = delBtn.dataset.crudDelete;
        if (!confirm('Remove this item from the merged view? Local deletes stay in session only.')) return;
        const delMap = {
          vendors: deleteVendor,
          budget: deleteBudget,
          contacts: deleteContact,
          events: deleteEvent,
        };
        (delMap[entity] || (() => {}))(id);
        if (typeof global.render === 'function') global.render();
      }
    });
  }

  function currentRoute() {
    const h = location.hash.replace(/^#\/?/, '') || 'dashboard';
    return h.split('/')[0] || 'dashboard';
  }

  function routeToEntity(r) {
    if (r === 'vendors' || r === 'budget' || r === 'contacts' || r === 'events') return r;
    const toolbar = document.querySelector('.crud-toolbar[data-entity]');
    if (toolbar) return toolbar.dataset.entity;
    return 'vendors';
  }

  function patchRenderers() {
    if (!global.RENDERERS) return;
    global.RENDERERS.vendors = renderVendors;
    global.RENDERERS.budget = renderBudget;
    global.RENDERERS.contacts = renderContacts;
    global.RENDERERS.events = renderEvents;
  }

  function initPhase4Crud() {
    ensureModalDom();
    patchRenderers();
    bindCrudClicks();
    initThemePicker();
  }

  const api = {

<script>/**
 * Phase 7 — Vendors page (product register · Chromatic Ritual)
 * Replaces card grid with grouped roster rows, filters, inline actions.
 */
(function (global) {
  'use strict';

  function esc(s) {
    return String(s ?? '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function statusClass(st) {
    const s = String(st || '').toUpperCase();
    if (s === 'ACTIVE' || s === 'CONFIRMED' || s === 'SIGNED' || s === 'PAID') return 'b-ok';
    if (s === 'OVERDUE' || s === 'URGENT') return 'b-bad';
    if (s === 'REFERENCE' || s === 'EVALUATING' || s === 'SUPERSEDED') return 'b-muted';
    return 'b-warn';
  }

  function tierLabel(t) {
    if (t === 'internal') return 'Planners & venue';
    if (t === 'critical') return 'Critical path';
    return 'Vendors';
  }

  function groupVendors(list) {
    const order = ['internal', 'critical', 'vendor', 'other'];
    const groups = new Map();
    for (const v of list) {
      const tier = v.tier || 'vendor';
      const key = order.includes(tier) ? tier : 'other';
      if (!groups.has(key)) groups.set(key, []);
      groups.get(key).push(v);
    }
    return order.filter((k) => groups.has(k)).map((k) => ({ tier: k, label: tierLabel(k), items: groups.get(k) }));
  }

  function contactActions(v) {
    const parts = [];
    if (v.email) {
      parts.push(
        `<a class="v-act" href="mailto:${esc(v.email)}" title="Email">Email</a>`
      );
    }
    if (v.phone) {
      parts.push(`<a class="v-act" href="tel:${esc(v.phone)}" title="Call">Call</a>`);
    }
    if (v.whatsapp) {
      const wa = String(v.whatsapp).replace(/\D/g, '');
      parts.push(
        `<a class="v-act" href="https://wa.me/${esc(wa)}" target="_blank" rel="noopener">WA</a>`
      );
    }
    return parts.length ? `<div class="v-actions">${parts.join('')}</div>` : '';
  }

  function renderVendorRow(v, crud) {
    const local =
      v._source === 'local' || String(v.id || '').startsWith('local-')
        ? '<span class="local-badge">local</span>'
        : '';
    const quote =
      v.quoteUsd != null && v.quoteUsd !== ''
        ? `<span class="v-quote">$${Number(v.quoteUsd).toLocaleString()}</span>`
        : '';
    const chips = (v.events || '')
      .split(/[,·]/)
      .slice(0, 2)
      .map((e) => `<span class="v-chip">${esc(e.trim())}</span>`)
      .join('');
    return (
      `<article class="v-row${v._source === 'local' ? ' local-item' : ''}" data-id="${esc(v.id)}">` +
      `<div class="v-row-main">` +
      `<div class="v-row-head">` +
      `<span class="v-name">${esc(v.name)}${local}</span>` +
      `<span class="badge ${statusClass(v.status)}">${esc(v.status)}</span>` +
      quote +
      `</div>` +
      `<div class="v-meta">${esc(v.role)} · ${esc(v.org)}</div>` +
      (chips ? `<div class="v-chips">${chips}</div>` : '') +
      (v.notes ? `<p class="v-notes">${esc(v.notes)}</p>` : '') +
      `</div>` +
      contactActions(v) +
      (crud ? global.BcCmdCrud?.rowActionsHtml?.(v.id) ?? '' : '') +
      `</article>`
    );
  }

  function renderVendorsRich() {
    const list = global.BcCmdCrud?.getMergedVendors?.() ?? global.DATA?.vendors ?? [];
    const active = list.filter((v) => /ACTIVE|CONFIRMED|SIGNED|URGENT/i.test(v.status)).length;
    const groups = groupVendors(list);

    const body = groups
      .map(
        (g) =>
          `<section class="v-section">` +
          `<h2 class="v-section-title font-serif">${esc(g.label)} <span class="v-count">${g.items.length}</span></h2>` +
          `<div class="v-roster">${g.items.map((v) => renderVendorRow(v, true)).join('')}</div>` +
          `</section>`
      )
      .join('');

    const toolbar = global.BcCmdCrud?.toolbarHtml?.('Vendors', 'vendors') ?? '';

    return (
      `<div class="page-head"><h1 class="font-serif">Vendor roster</h1>` +
      `<p>${list.length} contacts · ${active} active · grouped by tier</p></div>` +
      `<div class="v-toolbar-extra">` +
      `<input type="search" id="v-search" class="v-search" placeholder="Filter by name, org, role…" aria-label="Filter vendors">` +
      `<a class="v-ext-link" href="/vendors" target="_blank" rel="noopener">Open vendors ops hub ↗</a>` +
      `</div>` +
      toolbar +
      `<div id="v-roster-root">${body}</div>`
    );
  }

  let bound = false;

  function bindVendorFilter() {
    if (bound) return;
    const main = document.getElementById('main');
    if (!main) return;
    main.addEventListener('input', (e) => {
      if (e.target.id !== 'v-search') return;
      const q = e.target.value.toLowerCase();
      main.querySelectorAll('.v-row').forEach((row) => {
        const text = row.textContent.toLowerCase();
        row.style.display = !q || text.includes(q) ? '' : 'none';
      });
    });
    bound = true;
  }

  function initPhase7Vendors() {
    global.RENDERERS = global.RENDERERS || {};
    global.RENDERERS.vendors = renderVendorsRich;
    bindVendorFilter();
  }

  global.BcCmdVendors = { initPhase7Vendors, renderVendorsRich };
})(typeof window !== 'undefined' ? window : globalThis);
</script>
<script>/**
 * Phase 7 — Live ops: pathname routes, drag kanban, live stats refresh, KPI recompute
 */
(function (global) {
  'use strict';

  const LIVE_INTERVAL_MS = 60_000;
  let liveTimer = null;
  let dragBound = false;

  const PATH_ROUTES = new Set([
    'dashboard', 'events', 'tasks', 'vendors', 'rooming', 'comms', 'av', 'ops',
    'beloved', 'travel', 'budget', 'contacts',
  ]);

  function bootstrapPathRoute() {
    const path = location.pathname.replace(/\/+$/, '');
    const m = path.match(/\/app(?:\/([^/?#]+))?$/i);
    if (!m) return;
    const seg = (m[1] || 'dashboard').toLowerCase();
    const target = PATH_ROUTES.has(seg) ? seg : 'dashboard';
    const want = '#/' + (target === 'dashboard' ? '' : target);
    if (location.hash !== want && location.hash !== want.replace(/\/$/, '')) {
      location.hash = want;
    }
  }

  function computeBudgetStats() {
    const fx = global.DATA?.meta?.fxDefault ?? 1.37;
    const list = global.BcCmdCrud?.getMergedBudget?.() ?? global.DATA?.budget ?? [];
    let totalUsd = 0;
    let paidUsd = 0;
    for (const b of list) {
      const amt = b.usd ?? (b.cad ? b.cad / fx : 0);
      if (amt && b.status !== 'REFERENCE' && b.status !== 'EVALUATING') totalUsd += amt;
      if (b.status === 'PAID' && amt) paidUsd += amt;
    }
    return { totalBudgetUsd: Math.round(totalUsd), paidBudgetUsd: Math.round(paidUsd) };
  }

  function computeVendorStats() {
    const list = global.BcCmdCrud?.getMergedVendors?.() ?? global.DATA?.vendors ?? [];
    return {
      totalVendors: list.length,
      activeVendors: list.filter((v) => /ACTIVE|CONFIRMED|SIGNED|URGENT/i.test(v.status)).length,
    };
  }

  function refreshAllStats() {
    if (!global.DATA?.stats) return;
    if (typeof global.refreshStats === 'function') global.refreshStats();
    Object.assign(global.DATA.stats, computeBudgetStats(), computeVendorStats());
    global.DATA.stats.lastLiveRefresh = new Date().toISOString();
  }

  function startLiveStats() {
    if (liveTimer) return;
    refreshAllStats();
    liveTimer = setInterval(() => {
      refreshAllStats();
      const r = typeof global.route === 'function' ? global.route() : 'dashboard';
      if (r === 'dashboard' && typeof global.render === 'function') global.render();
    }, LIVE_INTERVAL_MS);
  }

  function kanbanColStatus(colEl) {
    const h = colEl?.querySelector('h3')?.textContent?.toLowerCase() || '';
    if (h.startsWith('in progress')) return 'in_progress';
    if (h.startsWith('done')) return 'done';
    return 'todo';
  }

  function bindDragKanban() {
    const main = document.getElementById('main');
    if (!main || dragBound) return;
    dragBound = true;

    main.addEventListener('dragstart', (e) => {
      const card = e.target.closest('.task-item[data-task-id]');
      if (!card || !main.querySelector('[data-task-board="kanban"]')) return;
      card.classList.add('dragging');
      e.dataTransfer.setData('text/plain', card.dataset.taskId);
      e.dataTransfer.effectAllowed = 'move';
    });

    main.addEventListener('dragend', (e) => {
      e.target.closest('.task-item')?.classList.remove('dragging');
    });

    main.addEventListener('dragover', (e) => {
      if (!e.target.closest('[data-task-board="kanban"]')) return;
      const col = e.target.closest('.k-col');
      if (!col) return;
      e.preventDefault();
      col.classList.add('drag-over');
    });

    main.addEventListener('dragleave', (e) => {
      e.target.closest('.k-col')?.classList.remove('drag-over');
    });

    main.addEventListener('drop', (e) => {
      const board = e.target.closest('[data-task-board="kanban"]');
      if (!board) return;
      const col = e.target.closest('.k-col');
      if (!col) return;
      e.preventDefault();
      col.classList.remove('drag-over');
      board.querySelectorAll('.k-col').forEach((c) => c.classList.remove('drag-over'));
      const id = e.dataTransfer.getData('text/plain');
      if (!id || typeof global.setTaskField !== 'function') return;
      const status = kanbanColStatus(col);
      global.setTaskField(id, { status });
      if (typeof global.saveTaskState === 'function') global.saveTaskState();
      refreshAllStats();
      if (typeof global.render === 'function') global.render();
    });
  }

  function patchRenderTaskCard() {
    if (typeof global.renderTaskCard !== 'function') return;
    const orig = global.renderTaskCard;
    global.renderTaskCard = function (t, opts) {
      let html = orig(t, opts);
      if (!opts?.compact && html.includes('class="task-item')) {
        html = html.replace(
          'class="task-item',
          'draggable="true" class="task-item'
        );
      }
      return html;
    };
  }

  function initPhase7Live() {
    bootstrapPathRoute();
    patchRenderTaskCard();
    refreshAllStats();
    startLiveStats();
    bindDragKanban();

    const origRender = global.render;
    if (origRender && !global.__bcRenderPatched) {
      global.render = function () {
        refreshAllStats();
        origRender();
        bindDragKanban();
      };
      global.__bcRenderPatched = true;
    }
  }

  global.BcCmdLive = { initPhase7Live, refreshAllStats, bootstrapPathRoute };
})(typeof window !== 'undefined' ? window : globalThis);
</script>
<script>if(sessionStorage.getItem('bc_cmd_auth')==='1')initApp();</script>
