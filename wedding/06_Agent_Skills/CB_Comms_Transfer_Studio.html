*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
header{background:linear-gradient(135deg,var(--deep),var(--teal));color:#FAF6EE;padding:28px 20px;text-align:center}
header h1{font-family:'Cormorant Garamond',serif;font-size:28px;color:#E8C97A;font-style:italic}
header p{font-size:13px;opacity:.9;margin-top:6px}
.back{color:#E8C97A;font-size:11px;letter-spacing:2px;text-transform:uppercase;text-decoration:none;display:inline-block;margin-top:12px}
.layout{max-width:1100px;margin:0 auto;padding:24px 16px 64px;display:grid;grid-template-columns:240px 1fr;gap:20px}
@media(max-width:800px){.layout{grid-template-columns:1fr}}
.sidebar{background:var(--card);border-radius:12px;padding:16px;border:1px solid var(--line);height:fit-content;position:sticky;top:16px}
.sidebar h2{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--gold);margin-bottom:12px}
.filter{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;margin-bottom:12px;font:inherit}
.msg-list{list-style:none;max-height:70vh;overflow:auto}
.msg-list button{width:100%;text-align:left;background:transparent;border:none;border-left:3px solid transparent;padding:10px 8px;cursor:pointer;border-radius:0 6px 6px 0;font:inherit;color:var(--text)}
.msg-list button:hover,.msg-list button.on{background:#F7EDD0;border-left-color:var(--gold)}
.msg-list .id{font-size:10px;color:var(--muted);letter-spacing:1px}
.msg-list .title{font-size:13px;font-weight:600;margin-top:2px}
.panel{background:var(--card);border-radius:12px;border:1px solid var(--line);overflow:hidden}
.panel-head{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.panel-head h3{font-family:'Cormorant Garamond',serif;font-size:22px;color:var(--deep)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{font-size:10px;letter-spacing:1px;text-transform:uppercase;padding:4px 10px;border-radius:12px;font-weight:600}
.chip-wa{background:#E8F8EC;color:#1A7A3A}
.chip-mail{background:#E8EEF8;color:var(--mail)}
.chip-p0{background:#FFE8E8;color:#A22}
.meta{padding:12px 20px;background:#FAF8F4;font-size:12px;color:var(--muted);border-bottom:1px solid var(--line)}
.meta strong{color:var(--deep)}
.body-wrap{padding:20px;position:relative}
.msg-body{background:#FAFAFA;border-left:4px solid var(--mail);padding:16px 18px;border-radius:0 8px 8px 0;font-size:14px;line-height:1.7;white-space:pre-wrap;min-height:200px}
.msg-body.wa{border-left-color:var(--wa);background:#F0FAF2}
.copy{position:absolute;top:28px;right:28px;background:var(--deep);color:#E8C97A;border:none;padding:8px 16px;border-radius:6px;font-size:12px;font-weight:600;letter-spacing:1px;cursor:pointer}
.copy:hover{background:var(--teal)}
.copy.done{background:#2E6E2E}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--deep);color:#fff;padding:12px 24px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}
</style>
</head>
<body>

const listEl = document.getElementById('list');
const filterEl = document.getElementById('filter');
const titleEl = document.getElementById('title');
const chipsEl = document.getElementById('chips');
const metaEl = document.getElementById('meta');
const bodyEl = document.getElementById('body');
const copyBtn = document.getElementById('copyBtn');
const toast = document.getElementById('toast');
let current = null;

function renderList(q=''){
  const ql = q.toLowerCase();
  listEl.innerHTML = '';
  MSGS.filter(m => !ql || m.title.toLowerCase().includes(ql) || m.id.toLowerCase().includes(ql)).forEach(m => {
    const li = document.createElement('li');
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.innerHTML = `<div class="id">${m.id} · ${m.channel === 'wa' ? 'WhatsApp' : 'Email'}</div><div class="title">${m.title}</div>`;
    btn.onclick = () => select(m, btn);
    if (current && current.id === m.id) btn.classList.add('on');
    li.appendChild(btn);
    listEl.appendChild(li);
  });
}
function select(m, btn){
  current = m;
  document.querySelectorAll('.msg-list button').forEach(b => b.classList.remove('on'));
  if (btn) btn.classList.add('on');
  titleEl.textContent = m.title;
  chipsEl.innerHTML = `<span class="chip chip-${m.channel === 'wa' ? 'wa' : 'mail'}">${m.channel === 'wa' ? 'WhatsApp' : 'Gmail'}</span><span class="chip chip-p0">${m.priority}</span>`;
  metaEl.innerHTML = `<strong>To:</strong> ${m.to}` + (m.subject ? ` · <strong>Subject:</strong> ${m.subject}` : '');
  bodyEl.textContent = m.body;
  bodyEl.className = 'msg-body' + (m.channel === 'wa' ? ' wa' : '');
}
async function copy(){
  if (!current) return;
  const text = current.channel === 'mail' && current.subject
    ? `To: ${current.to}\nSubject: ${current.subject}\n\n${current.body}`
    : current.body;
  await navigator.clipboard.writeText(text);
  copyBtn.textContent = 'Copied!';
  copyBtn.classList.add('done');
  toast.classList.add('show');
  setTimeout(() => { copyBtn.textContent = 'Copy'; copyBtn.classList.remove('done'); toast.classList.remove('show'); }, 2000);
}
filterEl.addEventListener('input', e => renderList(e.target.value));
copyBtn.addEventListener('click', copy);
renderList();
select(MSGS[0], listEl.querySelector('button'));
</script>
